server {
    listen 80;
    listen [::]:80;
    server_name dawnpanel.ir www.dawnpanel.ir apibot.dawnpanel.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dawnpanel.ir www.dawnpanel.ir;
    ssl_certificate /etc/letsencrypt/live/dawnpanel.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dawnpanel.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 46.38.138.243;
    real_ip_header X-Real-IP;
    client_max_body_size 12m;
    access_log /var/log/nginx/dawnpanel.access.log;
    error_log /var/log/nginx/dawnpanel.error.log;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location ~ /(?:\.|private/|telegram/|deploy/|manage.py|requirements) { return 404; }
    location ^~ /media/products/ { alias /var/lib/dawnpanel/media/products/; autoindex off; expires 7d; add_header X-Content-Type-Options nosniff always; add_header Content-Security-Policy "default-src 'none'" always; limit_except GET HEAD { deny all; } }
    location /static/ { alias /opt/dawnpanel/current/staticfiles/; expires 7d; add_header X-Content-Type-Options nosniff always; }
    location / {
        proxy_pass http://127.0.0.1:18145;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apibot.dawnpanel.ir;
    ssl_certificate /etc/letsencrypt/live/dawnpanel.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dawnpanel.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 46.38.138.243;
    real_ip_header X-Real-IP;
    client_max_body_size 256k;
    location /payment/verify {
        proxy_pass http://127.0.0.1:18145;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { return 302 https://dawnpanel.ir; }
}
