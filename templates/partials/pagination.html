{% if page.has_other_pages %}<nav class="pagination" aria-label="صفحه‌بندی">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;platform={{ platform|urlencode }}&amp;q={{ q|urlencode }}">صفحه قبل</a>{% endif %}<span>{{ page.number }} از {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;platform={{ platform|urlencode }}&amp;q={{ q|urlencode }}">صفحه بعد</a>{% endif %}</nav>{% endif %}
