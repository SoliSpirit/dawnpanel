{% load storefront %}
{% family_cover family cover_product as artwork %}
<picture class="theme-picture">
  {% if artwork.light %}<source data-theme-light srcset="{{ artwork.light }}" media="not all">{% endif %}
  <img src="{{ artwork.image }}" alt="{{ cover_alt|default:'' }}" width="540" height="360" decoding="async" {% if eager_cover %}fetchpriority="high"{% else %}loading="lazy"{% endif %}>
</picture>
