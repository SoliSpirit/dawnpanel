<div class="table-wrap"><table><thead><tr><th>کد پیگیری</th><th>محصول</th><th>مبلغ (تومان)</th><th>وضعیت</th><th></th></tr></thead><tbody>{% for order in orders %}<tr><td dir="ltr">{{ order.tracking_code }}</td><td>{{ order.product_name }}</td><td>{{ order.total_price }}</td><td><span class="chip">{{ order.status_label }}</span></td><td><a class="text-link" href="/account/orders/{{ order.pk }}/">جزئیات</a></td></tr>{% empty %}<tr><td colspan="5" class="empty">هنوز سفارشی ندارید. <a href="/services/">خدمات را ببینید.</a></td></tr>{% endfor %}</tbody></table></div>
