<article class="product-card"><div class="card-top"><span class="chip {{ product.platform }}">{{ product.get_platform_display }}</span><span class="muted">#{{ product.pk }}</span></div><a href="{{ product.get_absolute_url }}"><h3>{{ product.name }}</h3></a><p>{{ product.description|default:'جزئیات و شرایط سفارش را در صفحه محصول ببینید.'|truncatechars:110 }}</p><div class="card-bottom"><span>حداقل <b>{{ product.min_order }}</b> عدد</span><a class="text-link" href="{{ product.get_absolute_url }}">جزئیات و قیمت ←</a></div></article>
