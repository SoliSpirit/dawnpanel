{% extends 'account_base.html' %}{% load static %}{% block account %}<script src="{% static 'chat_desk.js' %}" defer></script><div class="section-title"><div><span class="eyebrow">SUPPORT DESK</span><h1>گفتگوی آنلاین</h1><p>هنگام بازبودن این صفحه، حضور شما به بازدیدکنندگان نمایش داده می‌شود.</p></div><a href="/staff/" class="text-link">میز مدیریت ←</a></div><div id="chat-desk" class="chat-desk" data-list-url="/staff/chat/api/"><aside class="desk-sidebar"><h2>گفتگوها <span id="desk-count"></span></h2><div id="desk-conversations"></div></aside><section class="desk-thread"><div class="desk-thread-head"><h2 id="desk-title">یک گفتگو را انتخاب کنید</h2><button type="button" id="desk-close-thread" class="outline-button" disabled>بستن گفتگو</button></div><div class="desk-messages chat-messages" id="desk-messages" role="log" aria-live="polite" data-lenis-prevent></div><p id="desk-error" class="chat-error" role="status"></p><form id="desk-form" data-async-form>{% csrf_token %}<label for="desk-body" class="visually-hidden">پاسخ پشتیبان</label><textarea id="desk-body" name="body" rows="2" maxlength="2000" placeholder="پاسخ به بازدیدکننده…" required disabled></textarea><button class="button small" type="submit" disabled>ارسال پاسخ ↗</button></form></section></div>{% endblock %}
