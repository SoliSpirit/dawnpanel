<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;background:#eff4f2;color:#193436;font-family:Tahoma,Arial,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eff4f2"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" dir="rtl" style="max-width:560px;background:#ffffff;border:1px solid #d2dfdc;border-radius:18px;text-align:right">
<tr><td style="padding:22px 26px;background:#164c49;color:#ffffff;border-radius:18px 18px 0 0"><strong style="font-size:23px">دان‌پنل</strong><span style="color:#bee7da;font-size:13px"> &nbsp; / &nbsp; مرکز اعلان‌ها</span></td></tr>
<tr><td style="padding:24px 26px"><h1 style="font-size:20px;line-height:1.7;margin:0 0 16px">{{ subject }}</h1>
{% for line in lines %}{% if line %}<p style="font-size:15px;line-height:1.9;margin:3px 0">{{ line }}</p>{% endif %}{% endfor %}
<p style="margin:24px 0 2px"><a href="{{ url }}" style="display:inline-block;padding:12px 23px;background:#087467;color:white;border-radius:10px;text-decoration:none;font-weight:bold;font-size:14px">{{ button }} ←</a></p></td></tr>
<tr><td style="border-top:1px solid #dce6e2;padding:14px 26px;color:#526863;font-size:12px;line-height:1.9">تنظیم این پیام‌ها از بخش «اعلان‌های تلگرام و ایمیل» پنل مدیریت در دسترس است.</td></tr>
</table></td></tr></table></body></html>
