{% extends 'base.html' %}{% block content %}<section class="wrap section narrow"><div class="panel"><span class="eyebrow">یک قدم تا ثبت</span><h1>سفارش را بررسی کنید.</h1><dl class="specs"><dt>خدمت</dt><dd>{{ product.name }}</dd><dt>تعداد</dt><dd>{{ pending.quantity }}</dd><dt>مقصد</dt><dd class="break-text" dir="ltr">{{ pending.target|default:'—' }}</dd><dt>مبلغ نهایی</dt><dd><strong>{{ total }} تومان</strong></dd></dl><form method="post" action="/account/checkout/">{% csrf_token %}<input type="hidden" name="key" value="{{ pending.key }}"><button class="button full">تأیید و پرداخت از کیف پول</button></form><a class="text-link spaced" href="{{ product.get_absolute_url }}">اصلاح سفارش ←</a></div></section>{% endblock %}
